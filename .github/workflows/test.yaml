name: Java CI with Maven

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25 (Milo server)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build OPC UA demo server
        working-directory: eclipse/milo/opc-ua-demo-server
        run: mvn -B clean package -DskipTests

      - name: Start OPC UA demo server
        working-directory: eclipse/milo/opc-ua-demo-server
        run: |
          nohup java -jar target/opc-ua-demo-server.jar > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for OPC UA server
        working-directory: eclipse/milo/opc-ua-demo-server
        run: |
          echo "Waiting for OPC UA server..."
          for i in {1..30}; do
            if nc -z localhost 4840; then
              echo "Server is up."
              exit 0
            fi
            sleep 2
          done

          echo "Server failed to start."
          cat server.log
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test connector
        run: mvn -B clean verify

      - name: Stop OPC UA server
        if: always()
        working-directory: eclipse/milo/opc-ua-demo-server
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcua-server-log
          path: eclipse/milo/opc-ua-demo-server/server.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: target/surefire-reports/*.xml